name: ci

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "Optional filename suffix (e.g. beta)"
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  FEATURES: outbound-net

jobs:
  test-and-build:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-aarch64-unknown-linux-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-unknown-linux-musl-cargo-

      - name: Update Cargo.lock
        run: cargo update -p tokio-tungstenite

      - name: Commit updated Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet || git commit -m "chore: update Cargo.lock"
          git push

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # ── 交叉编译 reflex（aarch64）────────────────────────────────────
      - name: Build reflex (aarch64, cross)
        run: |
          cross build \
            --release \
            --locked \
            --target aarch64-unknown-linux-musl \
            --bin reflex

      # ── 根据输入生成文件名 ───────────────────────────────────────────
      - name: Generate filenames
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.suffix }}" ]; then
            echo "BIN_NAME=reflex-linux-aarch64-${{ github.event.inputs.suffix }}-${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "SRC_NAME=test-code-${{ github.event.inputs.suffix }}-${{ github.run_number }}.zip" >> "$GITHUB_ENV"
          else
            echo "BIN_NAME=reflex-linux-aarch64-${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "SRC_NAME=test-code-${{ github.run_number }}.zip" >> "$GITHUB_ENV"
          fi

      # ── 收集产物 ────────────────────────────────────────────────────
      - name: Collect binary
        run: |
          mkdir -p dist
          BIN_DIR="target/aarch64-unknown-linux-musl/release"
          cp "$BIN_DIR/reflex" "dist/${BIN_NAME}"

      # ── 打包源码 ────────────────────────────────────────────────────
      - name: Archive source code
        run: |
          git archive --format=zip --output="dist/${SRC_NAME}" HEAD

      # ── 发布 Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          name: "reflex ci"
          prerelease: false
          files: |
            dist/${{ env.BIN_NAME }}
            dist/${{ env.SRC_NAME }}
