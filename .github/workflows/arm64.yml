name:  linux arm64 ci

on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  FEATURES: outbound-net
  BIN_NAME: reflex-aarch64-unknown-linux-musl

jobs:
  test-and-build:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-aarch64-unknown-linux-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-unknown-linux-musl-cargo-
      
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # ── 交叉编译 reflex（aarch64）────────────────────────────────────
      - name: Build reflex (aarch64, cross)
        run: |
          cross build \
            --release \
            --locked \
            --target aarch64-unknown-linux-musl \
            --bin reflex \
            --features "$FEATURES"

      # ── 收集产物 ────────────────────────────────────────────────────
      - name: Collect binary
        run: |
          mkdir -p dist
          BIN_DIR="target/aarch64-unknown-linux-musl/release"
          SUFFIX="$(head -n 1 update.log | tr -d '\r\n')"
          cp "$BIN_DIR/reflex" "dist/${BIN_NAME}-${SUFFIX}"
          echo "BIN_PATH=dist/${BIN_NAME}-${SUFFIX}" >> "$GITHUB_ENV"

      # ── 发布 Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bin
          name: "reflex ci"
          prerelease: false
          files: |
            ${{ env.BIN_PATH }}
