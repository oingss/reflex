name: android ci

on:
  workflow_dispatch:
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FEATURES: outbound-net

jobs:
  # ── 1. 交叉编译 reflex ────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:   aarch64-linux-android
            os:       ubuntu-latest
            artifact: reflex-android-arm64-v8a
            cross:    false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (aarch64)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked

      - name: Workaround NDK r23+ missing libgcc
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          find "${NDK_HOME}" -name "libunwind.a" -print | while read -r f; do
            dir=$(dirname "$f")
            echo "INPUT(-lunwind)" > "${dir}/libgcc.a"
            echo "Patched: ${dir}/libgcc.a"
          done

      - name: Update Cargo.lock to match new version
        shell: bash
        run: cargo update --workspace


      - name: Build reflex (Android arm64-v8a, NDK)
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 24 \
            build \
            --release \
            --locked \
            --bin reflex

      # ── 收集产物（Linux：直接二进制；Windows：.exe） ────────────────────
      - name: Collect binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          mkdir -p dist
          cp "$BIN" "dist/reflex-android-arm64"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          name: "reflex ci"
          prerelease: false
          files: |
            dist/*
