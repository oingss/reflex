name: linux 64 ci

on:
  workflow_dispatch:
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. 交叉编译 reflex ────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:   x86_64-unknown-linux-musl
            os:       ubuntu-latest
            artifact: reflex-linux-x86_64
            cross:    true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install musl-tools (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build reflex (Linux x86_64, native musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc


      # ── 收集产物（Linux：直接二进制；Windows：.exe） ────────────────────
      - name: Collect binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          name: "reflex ci"
          prerelease: false
          files: |
            dist/*
